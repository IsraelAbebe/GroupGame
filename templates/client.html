<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gardio Client</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Include Socket.IO client library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
    <h1>Gardio Client</h1>
    <h2>Session: {{ session_id }}</h2>

    <div id="input-area">
        <textarea id="answer-input" rows="4" cols="50" placeholder="Enter your answer here..."></textarea>
        <button id="submit-button">Submit Answer</button>
    </div>

    <div id="status-message" style="margin-top: 10px; color: green;">
        <!-- Status messages like 'Answer submitted!' or 'Answers closed.' will appear here -->
    </div>

    <!-- Include the client-specific JavaScript -->
    <script>
        // Pass session ID to JavaScript
        const SESSION_ID = "{{ session_id }}";
    </script>
    <script src="{{ url_for('static', filename='client.js') }}"></script>
</body>
</html>
